name: Release

# Publishes to npm when a `vX.Y.Z` tag is pushed. The tag is the trigger and the
# version is read from package.json — the guard below refuses to publish if the two
# disagree, because a tag that does not match what gets published makes every later
# `git checkout v0.1.0` a lie.
#
# Authentication is npm trusted publishing (OIDC): no stored credential, no
# `NPM_TOKEN` secret. Each run exchanges a short-lived token scoped to this repository
# and this workflow *filename*, which is registered at
# npmjs.com -> grok-build-mcp-server -> Settings -> Trusted publishing. Renaming this
# file breaks publishing, and npm does not validate the configuration until a publish
# is attempted — the symptom is ENEEDAUTH, not a helpful message.
#
# 0.1.0 was published with a token because a trusted publisher can only be attached to
# a package that already exists. That token has served its purpose; nothing here reads
# one any more.

# A pushed tag is the only trigger. There is deliberately no `workflow_dispatch`: a manual run
# from a branch would publish whatever version happens to be in package.json, with no tag to
# point at afterwards. A failed release is re-run from the Actions UI, which replays the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Provenance is a signed attestation that this tarball was built from this
      # commit by this workflow. It needs an OIDC token.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The engines floor, so the release is built by the oldest Node we claim
          # to support rather than by whatever is newest.
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x; OIDC publishing needs 11.5.1 or later. Pinning the
      # range here turns a missing feature into an install error rather than an
      # ENEEDAUTH at the last step.
      - name: Use an npm that can publish over OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci

      # The same gate CI runs. A release is not the place to find out the suite is red.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Coverage floors
        run: npm run test:coverage

      - name: Tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node --print "require('./package.json').version")
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # `npx -y grok-build-mcp-server` is the documented install, so prove the packed
      # tarball actually starts before it is published rather than after. The path is
      # carried to the publish step so the bytes that were probed are the bytes that
      # go to the registry — `npm publish` with no argument would pack a second time.
      - name: Packed tarball starts and speaks MCP
        shell: bash
        run: |
          tarball=$(npm pack --silent)
          echo "TARBALL=$PWD/$tarball" >> "$GITHUB_ENV"
          workdir=$(mktemp -d)
          npm install --prefix "$workdir" "$PWD/$tarball" --no-audit --no-fund
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release","version":"0"}}}'
          output=$(printf '%s\n' "$request" | "$workdir/node_modules/.bin/grok-build-mcp-server" 2>/dev/null)
          echo "$output"
          printf '%s' "$output" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const m=JSON.parse(s.trim().split("\n")[0]);if(m.result?.serverInfo?.name!=="grok-build")throw new Error("unexpected initialize result: "+s);})'

      # No token: the `id-token: write` permission above is the whole credential.
      # Provenance is generated automatically for a trusted publish from a public
      # repository, so `--provenance` is not passed — npm does it without asking.
      - name: Publish
        run: npm publish "$TARBALL" --access public

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." \
            --verify-tag
